name: Generate Profile Summary Cards

# Renders the GitHub Stats cards as SVGs and commits them to this repo, so the
# README never depends on a shared public instance that can hit API rate limits.
# Requires a repo secret SUMMARY_GITHUB_TOKEN: a classic PAT with `repo` +
# `read:user` scope (the default GITHUB_TOKEN cannot read user-level stats).

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: 5.5
          THEME: "tokyonight"
          AUTO_PUSH: true
